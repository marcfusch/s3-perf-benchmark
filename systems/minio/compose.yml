name: minio
x-node: &node
  image: mgl870/minio:RELEASE.2025-10-15T17-29-55Z
  restart: "no"
  mem_limit: 1g
  env_file: ../../env/minio.env
  command: server http://minio-node{1...3}/data
  networks: [bench]
services:
  node1:
    <<: *node
    container_name: minio-node1
    hostname: minio-node1
    volumes: [d1:/data]
  node2:
    <<: *node
    container_name: minio-node2
    hostname: minio-node2
    volumes: [d2:/data]
  node3:
    <<: *node
    container_name: minio-node3
    hostname: minio-node3
    volumes: [d3:/data]
volumes: {d1: {}, d2: {}, d3: {}}
networks:
  bench:
    name: bench
    external: true
